name: Resumen Code Timeline

on:
  pull_request:

permissions:
  contents: read

jobs:
  resumen:
    if: ${{ hashFiles('.code-timeline/history.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Publicar resumen verificable del PR
        run: node scripts/pr-versionado.mjs
